#
# Arduino variant Kconfig for rpi_zero_2w. Pairs with the matching
# .overlay; together they cover everything the loader and a sketch
# need that isn't already in the board defconfig.

# --- C++ runtime (validated Phase 1, see reference_aarch64_cpp_recipe) ---
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
# Build invocation must add `-- -DTOOLCHAIN_HAS_GLIBCXX=ON` (the
# cross-compile toolchain variant doesn't set it). Encoded in
# boards.txt as `build.zephyr_args`.

# --- LLEXT subsystem (validated Phase 0) ---
CONFIG_LLEXT=y
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y
# Heap sizing: aarch64 MMU has a 64 KiB page granule, and the llext
# allocator honors per-region alignment by handing out 64 KiB-aligned
# chunks. A real Arduino sketch has 8-10 ELF regions (text, rodata,
# data, bss, symtab, strtab, shstrtab, rela.text, rela.data, ...), so
# the heap floor is roughly N * 64 KiB. 1 MiB covers HelloSerial-class
# sketches with comfortable headroom; bump if a larger sketch hits
# `llext: Failed allocating ... bytes ...-aligned for region N`.

# Override the loader's prj.conf default of LLEXT_RODATA_NO_RELOC=y --
# that option requires !MMU, but MMU is always on on aarch64.
CONFIG_LLEXT_RODATA_NO_RELOC=n

# --- Sketch loader uses fs_loader (SD-FAT) instead of flash partition ---
# Provided by loader/Kconfig in this branch (`pizza`).
CONFIG_ARDUINO_SKETCH_LOADER_FS=y
# Default path is /SD:/sketch.llext; override via CONFIG_ARDUINO_SKETCH_LOADER_FS_PATH.

# No internal flash on this SoC; the upstream loader's prj.conf forces
# CONFIG_FLASH=y. Opt back out.
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n
CONFIG_LLEXT_HEAP_SIZE=1024

# Override the loader's prj.conf default of MALLOC_ARENA_SIZE=-1. With
# MMU=y that takes the "ALLOCATE_HEAP_AT_STARTUP" path which calls
# k_mem_map() for k_mem_free_get() bytes (~254 MiB here). That blows
# straight past CONFIG_KERNEL_VM_SIZE (8 MiB) and returns NULL; the
# arena init then crashes on the NULL base. Pin a sensible static arena.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=262144

# --- File system for SD-FAT sketch storage ---
# The board DTS already wires sdhost with a `zephyr,sdmmc-disk` child
# named "SD"; the variant overlay's `zephyr,fstab` node automounts it
# at /SD:.
CONFIG_DISK_ACCESS=y
CONFIG_SDMMC_SUBSYS=y
CONFIG_SDHC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_MAX_LFN=255

# Safety: do NOT format the SD card if mount fails. We share the FAT
# partition with the Pi boot firmware (config.txt, kernel.img) and a
# format-on-fail would wipe it. Make this explicit -- defaults are
# not the safety. See feedback_storage_bringup_explicit_mkfs_off.
CONFIG_FILE_SYSTEM_MKFS=n
CONFIG_FS_FATFS_MOUNT_MKFS=n

# --- Arduino API runtime needs ---
# No userspace -- Arduino sketches run in supervisor with full access.
CONFIG_USERSPACE=n

# Picolibc is the aarch64 default and is fine; do NOT force
# REQUIRES_FULL_LIBC (it would disturb the picolibc setup).
# REQUIRES_FULL_LIBC is enabled in the loader's prj.conf if needed
# by specific cores, not here.

# Per-thread errno for the USB stack -- THE Phase-6 USB-enumeration-crash fix.
#
# The Arduino cores need C++ (CONFIG_GLIBCXX_LIBCPP=y, above), and
# PICOLIBC_USE_MODULE `depends on !GLIBCXX_LIBCPP` -- so this loader is forced
# onto the *toolchain* picolibc (not the picolibc module the C-only Phase-6
# spike used). Toolchain-picolibc `errno` lives in a TLS section (.tbss.errno).
# But the `cross-compile` toolchain path defaults TLS support OFF
# (TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=n), so TLS is never
# set up and the first per-thread `errno` write faults -- which is exactly what
# the USB device stack's internal ch9 thread does on the first host SETUP
# packet (`errno = 0` at usbd_ch9.c:1009 -> data abort with a wild FAR on USB
# plug-in). The aarch64-zephyr-elf SDK compiler *does* support TLS; the
# cross-compile path just doesn't assume it. Assert it -> selects
# TOOLCHAIN_SUPPORTS_THREAD_LOCAL_STORAGE -> picolibc selects THREAD_LOCAL_STORAGE
# -> ERRNO_IN_TLS, errno valid on every thread incl. the USB stack's.
# (The spike sidestepped all this via the module's MULTITHREAD errno, which a
# C++ build can't select.) See feedback_zephyr_usbd_stack_sizes_aarch64.
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=y
CONFIG_THREAD_LOCAL_STORAGE=y

# --- Stacks ---
# The llext load path is stack-hungry (see Zephyr issue #74536) and
# Arduino's setup()/loop() runs from `main` -- give it room.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# --- Logging (handy during bring-up; can be lowered later) ---
# Logs land on the mini-UART console (chosen zephyr,console = uart1),
# kept separate from the USB-CDC `Serial` / upload channel below.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# --- USB device (NEXT stack) + CDC ACM: Phase-6 upload channel + `Serial` ---
# The loader owns USB bring-up and runs the in-process CDC upload+swap
# (no reboot -- BCM2710 has no sys_reboot). The sketch's `Serial`
# (SerialUSB_) attaches to the already-up CDC without re-initialising it,
# gated by CONFIG_ARDUINO_USB_LOADER_OWNED. See loader/main.c and USB.cpp.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USB_DEVICE_PRODUCT="PiZZa (Raspberry Pi Zero 2 W)"
CONFIG_USB_DEVICE_MANUFACTURER="jetpax/PiZZa"
CONFIG_USB_DEVICE_VID=0x2341
# Development PID; replace if/when a dedicated PizzaShell pid is assigned.
CONFIG_USB_DEVICE_PID=0x0070
# Loader brings USB up explicitly after the VC PHY power-on, not at boot.
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y
# Read the host-set CDC baud rate -> detect the IDE's 1200-bps upload touch.
CONFIG_UART_LINE_CTRL=y

# dwc2 controller on this SoC. Buffer-DMA is not used (matches the proven
# rpi_zero_2w CDC bring-up); see feedback_bcm2835_usb_cdc_kconfig.
CONFIG_UDC_DWC2=y
CONFIG_UDC_DWC2_DMA=n
# aarch64 USBD/UDC threads need 4096; defaults crash misleadingly
# (feedback_zephyr_usbd_stack_sizes_aarch64).
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=4096

# VideoCore mailbox path that powers on the USB PHY (see overlay &firmware).
CONFIG_RASPBERRYPI_FIRMWARE=y

# Loader RX ring buffer for the upload channel. Do NOT enable
# CONFIG_RING_BUFFER_LARGE: it widens ring_buf_idx_t (uint16->uint32) and so
# changes the size/layout of `struct ring_buf`, which the Arduino `Serial`
# embeds -- that would be an EDK ABI break forcing every sketch to be rebuilt.
# The loader's RX ring is therefore capped at the non-large max (32 KiB), still
# enough to hold a HelloSerial-class sketch whole so flow control (and its
# cdc_acm log spam) doesn't engage. See loader/main.c.
CONFIG_RING_BUFFER=y

# Keep the upload channel quiet -- USB churn shouldn't spam the UART log
# (spike README Phase-6 Next.4).
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# --- Phase-6 loader behaviour gates ---
# Loader owns USBD + runs the in-process CDC upload/swap supervisor.
CONFIG_ARDUINO_SKETCH_LOADER_CDC_UPLOAD=y
# Sketch's SerialUSB_ skips USBD re-init (loader already owns it).
# Propagated to the sketch build via the regenerated llext-EDK autoconf.h.
CONFIG_ARDUINO_USB_LOADER_OWNED=y

# --- WiFi + IP networking (on-module CYW43436 via brcmfmac, Arasan SDHCI) ---
# IMPORTANT: CONFIG_POLL (pulled in by NET_SOCKETS) grows struct k_sem 24->40
# (adds poll_events). The Arduino Serial embeds a k_sem, so sketches MUST be
# rebuilt against this EDK -- AND the cached Arduino core archive must be
# invalidated (dist-build.sh now clears ~/Library/Caches/arduino/cores), or the
# core keeps a 24-byte k_sem and the loader's k_sem_init/give corrupt memory
# (sys_dlist_remove -> FAR=0). Same EDK-ABI class as the RING_BUFFER_LARGE trap.
# Config = upstream arduino_giga_r1 WiFi variant merged with PizzaShell's proven
# brcmfmac + AArch64 net-stack sizes. brcmfmac firmware blobs ship with
# hal_broadcom. TLS off (SocketWrapper TLS paths are SOCKOPT_TLS-guarded).
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_ARP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_OPTION_CALLBACKS=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_DNS_RESOLVER=y

CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_NET_MGMT=y
CONFIG_POSIX_API=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_CONFIG_AUTO_INIT=n

CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20

CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TCP_WORKQ_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096

CONFIG_WIFI=y
CONFIG_WIFI_BRCMFMAC=y
CONFIG_WIFI_LOG_LEVEL_WRN=y

# sys_reboot() via BCM2710 PM block WDOG full-reset. Used by the
# sketch-swap path so every new sketch starts on a cold-booted kernel
# (no in-process state contamination from the previous sketch).
CONFIG_REBOOT=y

# --- PWM (analogWrite on D15/D16 = GPIO 12/13) ---
# Driver init is deferred (see the &pwm0 overlay node): the CM_PWM
# clock and pin mux only get touched when a sketch first calls
# analogWrite() on a PWM pin.
CONFIG_PWM=y
