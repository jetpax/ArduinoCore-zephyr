#
# Arduino variant Kconfig for rpi_zero_w (BCM2835, ARM1176JZF-S,
# ARMv6KZ, AArch32). Pairs with the matching .overlay; together they
# cover everything the loader and a sketch need that isn't already in
# the board defconfig.
#
# Scope: Blink + USB-CDC Serial + on-module BCM43430A1 WiFi via
# brcmfmac + Arasan SDHCI (external bcm2835-dma DREQ 11).

# --- C++ runtime ---
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
# Build invocation must add `-- -DTOOLCHAIN_HAS_GLIBCXX=ON` (the
# cross-compile toolchain variant doesn't set it). Encoded in
# boards.txt as `build.zephyr_args`.

# --- LLEXT subsystem ---
CONFIG_LLEXT=y
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y

# Override the loader's prj.conf default of LLEXT_RODATA_NO_RELOC=y --
# that option requires !MMU, but VMSAv6 MMU is always on here (the
# MATTR_SHARED-on-UP-ARM1176 fix turned caching on; the port runs
# uncached otherwise).
CONFIG_LLEXT_RODATA_NO_RELOC=n

# --- Sketch loader uses fs_loader (SD-FAT) instead of flash partition ---
# Provided by loader/Kconfig in this branch (`pizza`).
CONFIG_ARDUINO_SKETCH_LOADER_FS=y
# Default path is /SD:/sketch.llext; override via CONFIG_ARDUINO_SKETCH_LOADER_FS_PATH.

# No internal flash on this SoC; the upstream loader's prj.conf forces
# CONFIG_FLASH=y. Opt back out.
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n

# AArch32 VMSAv6 page granule is 4 KiB (vs 64 KiB on AArch64), so the
# per-region alignment overhead is much smaller. 1 MiB still comfortably
# covers a HelloSerial-class sketch with headroom; trim later if RAM
# pressure shows up.
CONFIG_LLEXT_HEAP_SIZE=1024

# Override the loader's prj.conf default of MALLOC_ARENA_SIZE=-1. With
# MMU=y that takes the "ALLOCATE_HEAP_AT_STARTUP" path which calls
# k_mem_map() for k_mem_free_get() bytes and blows past
# CONFIG_KERNEL_VM_SIZE. Pin a sensible static arena.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=262144

# --- File system for SD-FAT sketch storage ---
# Variant overlay's `zephyr,fstab` automounts /SD: from the sdhost
# node's sdmmc-disk child. The bcm2835.dtsi sdhost node was added
# alongside this step (Phase 3b retry, 2026-06-30).
CONFIG_DISK_ACCESS=y
CONFIG_SDMMC_SUBSYS=y
CONFIG_SDHC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_MAX_LFN=255

# Safety: do NOT format the SD card if mount fails. The 2026-05-29
# Phase 3b attempt format-wiped a PINN card; explicit-off here is the
# belt-and-brace fix. Defaults are not the safety.
CONFIG_FILE_SYSTEM_MKFS=n
CONFIG_FS_FATFS_MOUNT_MKFS=n

# Phase 3b root cause was an ARMv6 compiler bug (single LDR on misaligned
# pointer rotated the read); -mno-unaligned-access in arch/arm/core/CMakeLists.txt
# is the fix. SDHC + SD logs stay at default level; bump to DBG locally
# if you need to trace card enumeration again.

# --- Arduino API runtime needs ---
CONFIG_USERSPACE=n

# Per-thread errno for the USB stack. Same issue as the 2W: toolchain
# picolibc puts errno in TLS, the `cross-compile` toolchain path defaults
# TLS support OFF, so the first per-thread errno write faults. The ARMv6
# spike already taught us this lesson the hard way (TPIDRURO/errno
# collision was the deterministic ARMv6 boot crash). Assert TLS.
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=y
CONFIG_THREAD_LOCAL_STORAGE=y

# --- Stacks ---
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# --- Logging (handy during bring-up; can be lowered later) ---
# Logs land on the mini-UART console (chosen zephyr,console = uart1),
# kept separate from the USB-CDC `Serial` / upload channel below.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# --- USB device (NEXT stack) + CDC ACM: upload channel + `Serial` ---
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USB_DEVICE_PRODUCT="PiZZa (Raspberry Pi Zero W)"
CONFIG_USB_DEVICE_MANUFACTURER="jetpax/PiZZa"
CONFIG_USB_DEVICE_VID=0x2341
# Development PID; replace if/when a dedicated PiZZa Zero W pid is assigned.
CONFIG_USB_DEVICE_PID=0x0071
# Loader brings USB up explicitly after the VC PHY power-on, not at boot.
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y
# Read the host-set CDC baud rate -> detect the IDE's 1200-bps upload touch.
CONFIG_UART_LINE_CTRL=y

# dwc2 controller on this SoC (same block as BCM2710). Buffer-DMA not used;
# see feedback_bcm2835_usb_cdc_kconfig.
CONFIG_UDC_DWC2=y
CONFIG_UDC_DWC2_DMA=n
# Match the 2W's conservative stack sizes; the USBD/UDC threads' actual
# AArch32 high-water mark is smaller but 4096 leaves headroom.
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=4096

# VideoCore mailbox path that powers on the USB PHY (see overlay &firmware).
CONFIG_RASPBERRYPI_FIRMWARE=y

# Loader RX ring buffer for the upload channel. Do NOT enable
# CONFIG_RING_BUFFER_LARGE -- same EDK-ABI trap as on the 2W: it widens
# ring_buf_idx_t and changes struct ring_buf size, breaking every sketch.
CONFIG_RING_BUFFER=y

# Keep the upload channel quiet -- USB churn shouldn't spam the UART log.
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# --- Loader behaviour gates ---
# Loader owns USBD + runs the in-process CDC upload supervisor (sketch is
# written to /SD:/sketch.llext then sys_reboot cold).
CONFIG_ARDUINO_SKETCH_LOADER_CDC_UPLOAD=y
# Sketch's SerialUSB_ skips USBD re-init (loader already owns it).
CONFIG_ARDUINO_USB_LOADER_OWNED=y

# sys_reboot() via BCM2835 PM block WDOG full-reset. Used by the
# sketch-swap path so every new sketch starts on a cold-booted kernel.
CONFIG_REBOOT=y

# --- WiFi + IP networking (on-module BCM43430A1 via brcmfmac, Arasan SDHCI) ---
# IMPORTANT: CONFIG_POLL (pulled in by NET_SOCKETS) grows struct k_sem 24->40
# (adds poll_events). The Arduino Serial embeds a k_sem, so sketches MUST be
# rebuilt against this EDK -- AND the cached Arduino core archive must be
# invalidated (dist-build.sh clears ~/Library/Caches/arduino/cores), or the
# core keeps a 24-byte k_sem and the loader's k_sem_init/give corrupt memory
# (sys_dlist_remove -> FAR=0). Same EDK-ABI class as the RING_BUFFER_LARGE trap.
# Configuration mirrors the 2W's proven WiFi block; the firmware blob differs
# (BCM43430A1 on original Zero W vs BCM43436S on Zero 2 W). TLS off (WiFi
# SocketWrapper TLS paths are SOCKOPT_TLS-guarded).
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_ARP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_OPTION_CALLBACKS=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_DNS_RESOLVER=y

CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_NET_MGMT=y
CONFIG_POSIX_API=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_CONFIG_AUTO_INIT=n

CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20

CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TCP_WORKQ_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096

CONFIG_WIFI=y
CONFIG_WIFI_BRCMFMAC=y
CONFIG_WIFI_BRCMFMAC_FIRMWARE_FILE="brcmfmac43430-sdio.bin"
CONFIG_WIFI_BRCMFMAC_NVRAM_FILE="brcmfmac43430-sdio.txt"
# The 43430A1 firmware is a Cypress trim-on-build image: without this
# CLM blob the radio stays COUNTRY_DISABLEd (null country "#n") and
# every radio op fails BCME_NOTUP while WLC_UP still reports OK.
CONFIG_WIFI_BRCMFMAC_CLM_FILE="brcmfmac43430-sdio.clm_blob"
CONFIG_WIFI_BRCMFMAC_COUNTRY="GB"

CONFIG_WIFI_LOG_LEVEL_WRN=y

# --- PWM (analogWrite on D15/D16 = GPIO 12/13) ---
# Driver init is deferred (see the &pwm0 overlay node): the CM_PWM
# clock and pin mux only get touched when a sketch first calls
# analogWrite() on a PWM pin.
CONFIG_PWM=y
